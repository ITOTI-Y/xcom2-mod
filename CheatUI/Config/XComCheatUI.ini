[CheatUI.CheatUI_Commands]
; Key code from UIUtilities_Input: F10=609, F11=610. Other keys also need a binding in XComInput.ini.
HOTKEY=609
; Options listed at once for a list parameter; use the filter to find the rest.
MAX_OPTIONS=300

; Each command is a console command line. %1, %2, ... take its parameters in order.
; Context: Strategy, Tactical or Any. Parameter Kind: Number, Text, Choice (with
; Choices), Item, Ability, Tech, Character, SoldierClass, Soldier. Default fills the
; input box of Number and Text. Labels are in Localization/CheatUI.*, in CommandLabels under the
; command Id, CategoryLabels, ParamLabels under Id_1, Id_2, ..., and ChoiceLabels.

; Strategy: resources
+MENU_COMMANDS=(Id=GiveResource, Category=Resources, Context=Strategy, Command="GiveResource %1 %2", Params=((Kind=Choice, Choices=("Supplies", "Intel", "AlienAlloy", "EleriumDust", "EleriumCore", "AbilityPoint")), (Kind=Number, Default="100")))
+MENU_COMMANDS=(Id=GiveMeTonsOfResources, Category=Resources, Context=Strategy, Command="GiveMeTonsOfResources %1", Params=((Kind=Number, Default="9999")))
+MENU_COMMANDS=(Id=AddItem, Category=Resources, Context=Strategy, Command="AddItem %1 %2", Params=((Kind=Item), (Kind=Number, Default="1")))
+MENU_COMMANDS=(Id=GiveTech, Category=Resources, Context=Strategy, Command="GiveTech %1", Params=((Kind=Tech)))

; Strategy: soldiers
+MENU_COMMANDS=(Id=LevelUpBarracks, Category=Soldiers, Context=Strategy, Command="LevelUpBarracks %1", Params=((Kind=Number, Default="1")))
+MENU_COMMANDS=(Id=HealAllSoldiers, Category=Soldiers, Context=Strategy, Command="HealAllSoldiers")
+MENU_COMMANDS=(Id=MakeAllSoldiersReady, Category=Soldiers, Context=Strategy, Command="MakeAllSoldiersReady")
+MENU_COMMANDS=(Id=SetSoldierStat, Category=Soldiers, Context=Strategy, Command="SetSoldierStat %1 %2 %3 true", Params=((Kind=Choice, Choices=("eStat_HP", "eStat_Offense", "eStat_Defense", "eStat_Mobility", "eStat_Will", "eStat_Hacking", "eStat_Dodge", "eStat_PsiOffense")), (Kind=Number, Default="100"), (Kind=Soldier)))
+MENU_COMMANDS=(Id=MakeSoldierAClass, Category=Soldiers, Context=Strategy, Command="MakeSoldierAClass %1 %2", Params=((Kind=Soldier), (Kind=SoldierClass)))
+MENU_COMMANDS=(Id=GiveScientist, Category=Soldiers, Context=Strategy, Command="GiveScientist %1", Params=((Kind=Number, Default="5")))
+MENU_COMMANDS=(Id=GiveEngineer, Category=Soldiers, Context=Strategy, Command="GiveEngineer %1", Params=((Kind=Number, Default="5")))
+MENU_COMMANDS=(Id=RespecSelectedSoldier, Category=Soldiers, Context=Strategy, Command="RespecSelectedSoldier")

; Strategy: campaign
+MENU_COMMANDS=(Id=CompleteCurrentCovertAction, Category=Campaign, Context=Strategy, Command="CompleteCurrentCovertAction")
+MENU_COMMANDS=(Id=TriggerEndOfMonth, Category=Campaign, Context=Strategy, Command="TriggerEndOfMonth")
+MENU_COMMANDS=(Id=MeetAllFactions, Category=Campaign, Context=Strategy, Command="MeetAllFactions")
+MENU_COMMANDS=(Id=MeetAllChosen, Category=Campaign, Context=Strategy, Command="MeetAllChosen")
+MENU_COMMANDS=(Id=RemoveFortressDoom, Category=Campaign, Context=Strategy, Command="RemoveFortressDoom %1", Params=((Kind=Number, Default="1")))

; Tactical: toggles
+MENU_COMMANDS=(Id=ToggleUnlimitedActions, Category=Toggles, Context=Tactical, Command="ToggleUnlimitedActions")
+MENU_COMMANDS=(Id=ToggleUnlimitedAmmo, Category=Toggles, Context=Tactical, Command="ToggleUnlimitedAmmo")
+MENU_COMMANDS=(Id=ToggleInvincibility, Category=Toggles, Context=Tactical, Command="ToggleInvincibility")
+MENU_COMMANDS=(Id=TakeNoDamage, Category=Toggles, Context=Tactical, Command="TakeNoDamage")
+MENU_COMMANDS=(Id=DeadEye, Category=Toggles, Context=Tactical, Command="DeadEye true")
+MENU_COMMANDS=(Id=ForceCritHits, Category=Toggles, Context=Tactical, Command="ForceCritHits")
+MENU_COMMANDS=(Id=ToggleFOW, Category=Toggles, Context=Tactical, Command="ToggleFOW")

; Tactical: units
+MENU_COMMANDS=(Id=PowerUp, Category=Units, Context=Tactical, Command="PowerUp")
+MENU_COMMANDS=(Id=GiveActionPoints, Category=Units, Context=Tactical, Command="GiveActionPoints %1", Params=((Kind=Number, Default="2")))
+MENU_COMMANDS=(Id=GiveItem, Category=Units, Context=Tactical, Command="GiveItem %1", Params=((Kind=Item)))
+MENU_COMMANDS=(Id=GiveAbility, Category=Units, Context=Tactical, Command="GiveAbility %1", Params=((Kind=Ability)))
+MENU_COMMANDS=(Id=TeleportToCursor, Category=Units, Context=Tactical, Command="TeleportToCursor")
+MENU_COMMANDS=(Id=KillClosestUnitToCursor, Category=Units, Context=Tactical, Command="KillClosestUnitToCursor")

; Tactical: mission
+MENU_COMMANDS=(Id=SkipAI, Category=Mission, Context=Tactical, Command="SkipAI")
+MENU_COMMANDS=(Id=EndBattleWin, Category=Mission, Context=Tactical, Command="EndBattle true")
