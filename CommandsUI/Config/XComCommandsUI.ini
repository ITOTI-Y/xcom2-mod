[CommandsUI.CommandsUI_Commands]
; Key code from UIUtilities_Input: F10=609, F11=610. Other keys also need a binding in XComInput.ini.
HOTKEY=609
; Options listed at once for a list parameter; use the filter to find the rest.
MAX_OPTIONS=300

; Each command is a console command line. %1, %2, ... take its parameters in order.
; Context: Strategy, Tactical or Any. Parameter Kind: Number, Text, Choice (with
; Choices), Item, Ability, Tech, Character, SoldierClass, Soldier. Default fills the
; input box of Number and Text.
; RequiredMod: DLC name of the mod that adds the command; it is listed only while that
; mod is active. bAdvanced=true lists it only after "show all". Toggle names the state
; the checkbox shows (UnlimitedActions, UnlimitedAmmo, Invincible, DeadEye,
; ForceCritHits, NoFOW); toggles left on are turned on again in later missions.
; Labels are in Localization/CommandsUI.*, in CommandLabels under the command Id,
; CategoryLabels, ParamLabels under Id_1, Id_2, ..., and ChoiceLabels.

; Strategy: resources
+MENU_COMMANDS=(Id=GiveResource, Category=Resources, Context=Strategy, Command="GiveResource %1 %2", Params=((Kind=Choice, Choices=("Supplies", "Intel", "AlienAlloy", "EleriumDust", "EleriumCore", "AbilityPoint")), (Kind=Number, Default="100")))
+MENU_COMMANDS=(Id=GiveMeTonsOfResources, Category=Resources, Context=Strategy, Command="GiveMeTonsOfResources %1", Params=((Kind=Number, Default="9999")))
+MENU_COMMANDS=(Id=AddItem, Category=Resources, Context=Strategy, Command="AddItem %1 %2", Params=((Kind=Item), (Kind=Number, Default="1")))
+MENU_COMMANDS=(Id=GiveTech, Category=Resources, Context=Strategy, Command="GiveTech %1", Params=((Kind=Tech)))

