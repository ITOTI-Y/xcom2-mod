; Keys reach the menu only when they are bound to their key event. The Avenger binds
; neither F10 nor F11, so both layers get them here; another HOTKEY needs its own line.
[XComGame.XComHeadquartersInput]
+Bindings=(Name="F10", Command="F10_Key_Press | onrelease F10_Key_Release", bPrimaryBinding=True)
+Bindings=(Name="F11", Command="F11_Key_Press | onrelease F11_Key_Release", bPrimaryBinding=True)

[XComGame.XComTacticalInput]
+Bindings=(Name="F10", Command="F10_Key_Press | onrelease F10_Key_Release", bPrimaryBinding=True)
+Bindings=(Name="F11", Command="F11_Key_Press | onrelease F11_Key_Release", bPrimaryBinding=True)
