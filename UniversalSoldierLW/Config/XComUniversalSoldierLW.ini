[UniversalSoldierLW.USLW_Specs]
; Specializations each soldier chooses. The promotion screen shows one ability column
; per specialization.
SPECIALIZATION_COUNT=3

; Every class that can be drawn for a new soldier offers its ability columns as
; specializations. Classes listed here are left out.
;+EXCLUDED_CLASSES=LWS_Technical

; Abilities a soldier should learn only one of, in priority order. Abilities that share
; a localized name, or where one replaces the other through OverrideAbilities, are
; already treated this way.
;+ABILITY_GROUPS=(Abilities=(Shadowstep, Shadowstep_LW))

; Abilities each soldier chooses to start with, after its specializations; 0 skips the
; step. The pool is every ability in the random decks (the XCOM row) of the classes
; above, plus the extra and minus the excluded abilities listed here.
ORIGIN_ABILITY_COUNT=2
;+ORIGIN_EXTRA_ABILITIES=LightningReflexes
;+ORIGIN_EXCLUDED_ABILITIES=DeepCover

[UniversalSoldierLW.USLW_Stats]
; Stat upgrades bought with ability points: Amount per purchase, Cost of the first
; purchase, CostIncrease per earlier purchase, and MaxPurchases.
REQUIRE_TRAINING_CENTER=true
+STAT_UPGRADES=(Stat=eStat_Offense,  Amount=2,  Cost=8,  CostIncrease=4,  MaxPurchases=5)
+STAT_UPGRADES=(Stat=eStat_HP,       Amount=1,  Cost=15, CostIncrease=10, MaxPurchases=2)
+STAT_UPGRADES=(Stat=eStat_Defense,  Amount=3,  Cost=8,  CostIncrease=4,  MaxPurchases=3)
+STAT_UPGRADES=(Stat=eStat_Mobility, Amount=1,  Cost=20, CostIncrease=15, MaxPurchases=2)
+STAT_UPGRADES=(Stat=eStat_Will,     Amount=5,  Cost=5,  CostIncrease=3,  MaxPurchases=4)
+STAT_UPGRADES=(Stat=eStat_Dodge,    Amount=5,  Cost=8,  CostIncrease=4,  MaxPurchases=3)
+STAT_UPGRADES=(Stat=eStat_Hacking,  Amount=10, Cost=5,  CostIncrease=3,  MaxPurchases=3)
